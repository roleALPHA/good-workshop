# ══════════════════════════════════════════════════════════════════════════════
# GoodWorkshop — On-Premise
#
#   docker compose --profile tls up -d
#
# TWO THINGS THAT GO WRONG HERE FIRST:
#
# 1. Passkeys need HTTPS. Except on localhost, browsers refuse WebAuthn over
#    http:// -- an installation on http://192.168.1.50:3000 has no passkeys at
#    all. Which is why the `tls` profile is the recommended route and the e-mail
#    token is a full second route, not a stopgap.
#
# 2. GW_RP_ID hangs off the hostname. Change it after passkeys have been
#    registered and ALL registered passkeys are invalid. Decide it beforehand.
#
# Without HTTPS and without SMTP you still get in:
#    docker compose exec app node scripts/cli.mjs login-link --email you@example.com
# ══════════════════════════════════════════════════════════════════════════════

# EVERY ROLE HAS ITS OWN PASSWORD, AND NONE OF THEM IS IN THIS FILE.
#
# On first start the `secrets` service generates one random password per role
# into a volume; db, migrate and app read them from there. So no secret sits in
# the .env, in `docker inspect`, in a dump or in a log excerpt -- and the
# separation of roles is enforced for the first time.
#
# Before this there was peer authentication over a shared socket, with the nicer
# promise of "no password, anywhere". It could not work: peer compares the OS
# user of the connecting PROCESS with the role name, and the app container runs
# as `node` (uid 1000) while the database container knows uid 70 as `postgres`
# and nobody at 1000. No connection across the container boundary could ever
# succeed -- and because the Postgres image's entrypoint does not initialise at
# all without a password or `trust`, the stack did not start on a fresh
# installation.
#
# `trust` would have been the wrong way out: it lets any process in any
# container on the network in as any role, superuser included. RLS, NOINHERIT
# and the revoke on the identity tables all rest on the application being
# exclusively gw_app.
#
# Two anchors rather than one. The web container gets gw_app and nothing else --
# the unprivileged role that RLS, NOINHERIT and the revoke on the identity
# tables were built for. Hand it the anchor as well and the superuser connection
# sits ready in the one container an attacker reaches first, and the whole wall
# is worth one line.
#
# `db` publishes no port. The database is reachable only from this compose
# network -- and there only with the password of the role in question.
x-app-db: &app-db
  DATABASE_URL: postgres://gw_app@db:5432/goodworkshop
  DATABASE_PASSWORD_FILE: /run/db-secrets/gw_app/password

x-migrate-db: &migrate-db
  DATABASE_URL: postgres://gw_app@db:5432/goodworkshop
  DATABASE_PASSWORD_FILE: /run/db-secrets/gw_app/password
  MIGRATION_DATABASE_URL: postgres://gw_owner@db:5432/goodworkshop
  MIGRATION_DATABASE_PASSWORD_FILE: /run/db-secrets/gw_owner/password
  ADMIN_DATABASE_URL: postgres://postgres@db:5432/goodworkshop
  ADMIN_DATABASE_PASSWORD_FILE: /run/db-secrets/postgres/password

services:
  # Runs once and exits. Creates missing role passwords into the volume that db,
  # migrate and app read them from -- and does not touch existing ones
  # an, damit ein Neustart keine laufende Installation aussperrt.
  secrets:
    image: ghcr.io/rolealpha/good-workshop:${GW_VERSION:?GW_VERSION must be set -- a moving tag is not a deployment}
    restart: 'no'
    # As root, and only this one service: a fresh Docker volume belongs to root,
    # and otherwise nobody could write the first file into it. It does exactly
    # one thing and exits; app and migrate keep running as `node`.
    user: '0:0'
    command: ['node', 'scripts/db-secrets.mjs']
    # Der einzige Ort, an dem alle vier zusammenliegen -- in einem Container,
    # der Sekunden lebt und nichts aus dem Netz annimmt.
    volumes:
      - secret_postgres:/run/db-secrets/postgres
      - secret_gw_owner:/run/db-secrets/gw_owner
      - secret_gw_app:/run/db-secrets/gw_app
      - secret_gw_ops:/run/db-secrets/gw_ops
      - secret_app:/run/db-secrets/app

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: goodworkshop
      POSTGRES_USER: postgres
      # From the file, not from the environment: POSTGRES_PASSWORD would show up in
      # `docker inspect`. Der Entrypoint verlangt eines von beiden, sonst
      # initialisiert er die Datenbank gar nicht erst.
      POSTGRES_PASSWORD_FILE: /run/db-secrets/postgres/password
      # `peer` for the local socket INSIDE the container -- that is the route
      # `docker compose exec -u postgres db pg_dump` takes. Over TCP the default
      # scram-sha-256 applies, and without a published port the network
      # dieses Stacks die einzige Herkunft, aus der jemand es versuchen kann.
      POSTGRES_INITDB_ARGS: '--auth-local=peer'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - secret_postgres:/run/db-secrets/postgres:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d goodworkshop']
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      secrets:
        condition: service_completed_successfully

  # Runs once and exits. `app` starts only once this has
  # erfolgreich durch ist -- ein Rolling Deploy mit ausstehender Migration
  # liefert damit gar nichts erst aus.
  migrate:
    image: ghcr.io/rolealpha/good-workshop:${GW_VERSION:?GW_VERSION must be set -- a moving tag is not a deployment}
    restart: 'no'
    # Vier Schritte, und die Reihenfolge ist die Aussage: preflight liest nur und
    # bricht ab, BEVOR migrate die erste Zeile anfasst. Eine Migration, die an
    # den vorhandenen Daten scheitert, tut das sonst mittendrin -- mit einem
    # nackten Postgres-Fehler, einem `app`, das wegen
    # service_completed_successfully gar nicht erst startet, und ohne ein Wort
    # dazu, welche Zeilen gemeint sind.
    command: >-
      sh -c "node scripts/db-bootstrap.mjs &&
             node scripts/preflight.mjs &&
             node scripts/migrate.mjs &&
             node scripts/provision.mjs"
    environment:
      <<: *migrate-db
      GW_APP_URL: ${GW_APP_URL:?GW_APP_URL must be set}
      GW_EDITION: ${GW_EDITION:-community}
      # Legt beim allerersten Lauf einen Admin an und druckt einen einmaligen
      # sign-in link to stdout -- independently of the mail configuration.
      GW_BOOTSTRAP_ADMIN_EMAIL: ${GW_BOOTSTRAP_ADMIN_EMAIL:-}
    # Three, because this service needs three roles: superuser for the roles
    # themselves, gw_owner for the schema, gw_app for provisioning through the
    # same door as the application. It does not get gw_ops.
    volumes:
      - secret_postgres:/run/db-secrets/postgres:ro
      - secret_gw_owner:/run/db-secrets/gw_owner:ro
      - secret_gw_app:/run/db-secrets/gw_app:ro
    depends_on:
      db:
        condition: service_healthy

  app:
    image: ghcr.io/rolealpha/good-workshop:${GW_VERSION:?GW_VERSION must be set -- a moving tag is not a deployment}
    restart: unless-stopped
    environment:
      <<: *app-db
      GW_APP_URL: ${GW_APP_URL:?GW_APP_URL must be set}
      GW_RP_ID: ${GW_RP_ID:-}
      # No default. `console` prints complete, valid sign-in links to stdout --
      # the right decision for an installation with no relay,
      # und eine, die man trifft, statt sie zu bekommen, weil man nichts gesagt
      # has. Anybody who can read `docker logs` could otherwise have a link
      # Adresse einen Link ausstellen lassen und abholen.
      GW_MAIL_TRANSPORT: ${GW_MAIL_TRANSPORT:?GW_MAIL_TRANSPORT must be set -- smtp, graph, console or none}
      # Entweder die URL direkt -- oder, besser, SMTP_URL_FILE auf ein Docker
      # Secret. Eine Environment-Variable mit Passwort steht in `docker
      # inspect`, in /proc/<pid>/environ und in jedem Core-Dump; ein Secret
      # liegt auf einem tmpfs und nur im Dateisystem des Containers.
      SMTP_URL: ${SMTP_URL:-}
      SMTP_URL_FILE: ${SMTP_URL_FILE:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # Microsoft Graph statt SMTP. Viele Microsoft-365-Mandanten haben SMTP
      # AUTH abgeschaltet -- dort ist das nicht die bequemere, sondern die
      # only possibility. The secret is better given as GW_GRAPH_CLIENT_SECRET_FILE
      # aus einer Datei, aus demselben Grund wie bei SMTP_URL_FILE.
      GW_GRAPH_TENANT_ID: ${GW_GRAPH_TENANT_ID:-}
      GW_GRAPH_CLIENT_ID: ${GW_GRAPH_CLIENT_ID:-}
      GW_GRAPH_CLIENT_SECRET: ${GW_GRAPH_CLIENT_SECRET:-}
      GW_GRAPH_CLIENT_SECRET_FILE: ${GW_GRAPH_CLIENT_SECRET_FILE:-}
      GW_GRAPH_SENDER: ${GW_GRAPH_SENDER:-}
      GW_EDITION: ${GW_EDITION:-community}
      # Der Tag, der laut .env laufen soll -- derselbe Wert, der oben das Image
      # picks. Without this line /api/health reports the ARG value from the
      # Dockerfile (`dev` bei einem selbst gebauten Image), und die eine Frage,
      # the endpoint exists for -- which revision is running here -- becomes
      # falsch beantwortet.
      GW_VERSION: ${GW_VERSION}
      GW_COLLAB_PORT: '3001'
      # Standen in .env.example und in der README, erreichten den Container aber
      # nicht: eine dokumentierte Variable, die nirgends ankommt, ist eine
      # instructions that lead nowhere. `check-docs.mjs` checks that now.
      # Decrypts the credentials entered in the interface. Without a value the
      # file from the volume is used; anybody who would rather keep the key
      # selbst verwaltet, setzt GW_SECRET_KEY in der .env.
      GW_SECRET_KEY: ${GW_SECRET_KEY:-}
      GW_SECRET_KEY_FILE: ${GW_SECRET_KEY_FILE:-/run/db-secrets/app/secret-key}
      GW_COLLAB_URL: ${GW_COLLAB_URL:-}
      GW_COLLAB_INTERNAL_URL: ${GW_COLLAB_INTERNAL_URL:-}
      # Ohne diesen Wert antwortet /api/health nur mit "ok" bzw. "unhealthy"
      # and which check failed -- the endpoint faces the internet. Set it and
      # `x-ops-token` additionally returns the version,
      # Migrationsstand und den Treiberfehler im Klartext.
      GW_OPS_TOKEN: ${GW_OPS_TOKEN:-}
      # How many proxies stand in front of the application. Throttling and logs only.
      GW_TRUSTED_PROXIES: ${GW_TRUSTED_PROXIES:-1}
      GW_SESSION_IDLE_DAYS: ${GW_SESSION_IDLE_DAYS:-14}
      # Time zone for dates in the interface. Explicit rather than inferred:
      # without it the server formats in the CONTAINER's zone and the browser in
      # the visitor's, so the same timestamp renders two ways on one page.
      GW_TIMEZONE: ${GW_TIMEZONE:-Europe/Berlin}
    # EINS. Der Web-Container kennt das Passwort von gw_app und von keiner
    # anderen Rolle -- das ist der "zwei Anker"-Punkt von oben, in Dateiform.
    # Were the superuser secret here too, the whole wall would be worth one line.
    #
    # Plus the application key: it decrypts the credentials an administrator
    # enters in the interface. It belongs in the backup -- unlike the role
    # passwords, which every installation can generate afresh.
    volumes:
      - secret_gw_app:/run/db-secrets/gw_app:ro
      - secret_app:/run/db-secrets/app:ro
    # Nur an 127.0.0.1, nie an 0.0.0.0: ohne den Proxy davor ist nichts
    # erreichbar, auch bei falsch stehender Firewall nicht.
    #
    # Zwei Ports: die Anwendung, und der Kollaborations-Dienst. Der zweite
    # existiert, weil Next aus einem Route-Handler kein WebSocket-Upgrade
    # from a route handler -- but it runs in the same container, from the same image.
    ports:
      - '127.0.0.1:${GW_PORT:-3000}:3000'
      - '127.0.0.1:${GW_COLLAB_PORT:-3001}:3001'
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Automatisches HTTPS. Ohne das keine Passkeys -- siehe oben.
  caddy:
    profiles: [tls]
    image: caddy:2-alpine
    restart: unless-stopped
    # `{$GW_HOSTNAME}` im Caddyfile ist Caddys eigene Substitution INNERHALB des
    # gemounteten Files, keine Compose-Interpolation -- und Compose reicht .env
    # nicht von sich aus in Container. Ohne diese Zeile hat der Site-Block keine
    # Adresse, der Proxy kommt nicht hoch, und weil `app` nur an 127.0.0.1
    # depends on it, the installation is unreachable from outside. The next move
    # Betreibers ist dann HTTP ohne TLS.
    environment:
      GW_HOSTNAME: ${GW_HOSTNAME:-}
    # Checked here rather than with `${GW_HOSTNAME:?}` above: Compose interpolates
    # GANZE Datei beim Laden, auch Dienste, deren Profil gar nicht aktiv ist.
    # A required field at this spot would therefore have broken every
    # `docker compose up` without the tls profile -- and being able to start
    # without HTTPS is an explicitly supported route. This way it fails loudly,
    # but only for those
    # die den Proxy wirklich benutzen.
    command: >-
      sh -c 'test -n "$$GW_HOSTNAME" || {
               echo "GW_HOSTNAME muss gesetzt sein: der Hostname, auf den das TLS-Zertifikat lautet." >&2
               echo "Er muss oeffentlich auf diesen Server aufloesen, sonst schlaegt die Ausstellung fehl." >&2
               exit 1
             }
             exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile'
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]

volumes:
  pgdata:
  # Ein Volume je Rolle, damit ein Dienst nur das bekommt, was er braucht.
  secret_postgres:
  secret_gw_owner:
  secret_gw_app:
  secret_gw_ops:
  secret_app:
  caddy_data:
  caddy_config:
