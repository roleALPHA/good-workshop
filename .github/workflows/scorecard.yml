name: Scorecard

# OpenSSF Scorecard: a third party's checklist of this repository's supply-chain
# hygiene -- pinned actions, branch protection, token permissions, signed
# releases. Published, so that somebody evaluating GoodWorkshop for their
# organisation can read the score without taking our word for it.
on:
  push:
    branches: [main]
  schedule:
    - cron: '41 5 * * 3'
  # Branch protection is one of the checks, and it changes in the settings,
  # not in a commit.
  branch_protection_rule:
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    # Scorecard only publishes results for the default branch.
    if: github.ref == 'refs/heads/main'
    permissions:
      # Findings into the Security tab.
      security-events: write
      # To publish the results to the OpenSSF API, which verifies the run by
      # this token -- the one step here that needs it.
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@977e6ceaea7361825998245d787fa3b4d6b9e5df # v2.27.0
        with:
          sarif_file: results.sarif
