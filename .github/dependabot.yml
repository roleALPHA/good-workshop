version: 2
# A week of cooldown on every ecosystem. The supply-chain attacks of the last
# years published a malicious version and were caught within days; a
# dependency that has been out for a week has had those days. Security updates
# are not delayed by this -- Dependabot applies cooldown to version updates only.
updates:
  # Actions are pinned to full-length commit SHAs, which means they can only be
  # updated by a bot that understands the pin. Without this file the pinning
  # convention silently turns into "we run 2026's actions forever".
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
      production-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
    # Drei Majors, die nicht an uns scheitern, sondern an einem Paket, das sie
    # noch nicht mitgeht. Ohne diese Eintraege legt Dependabot die
    # dev-dependencies-Gruppe jede Woche rot an, und der Rest der Gruppe kommt
    # deshalb nie durch. Jeder Eintrag nennt, was sich bewegen muss, damit er
    # wieder verschwindet -- ein ignore ohne diese Bedingung waere die stille
    # Entscheidung, 2026er Werkzeug fuer immer zu fahren.
    ignore:
      # typescript-eslint deckelt `typescript` auf <6.1.0 (Stand 8.71.0) und
      # wirft beim Laden, nicht bei einer Regel. Weg, sobald sein peer TS 7
      # nennt: https://github.com/typescript-eslint/typescript-eslint/issues/10940
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # eslint-plugin-react 7.37.5 ruft `context.getFilename()`, das ESLint 10
      # entfernt hat. Es haengt an eslint-config-next, ist also nicht direkt
      # waehlbar. Weg, sobald eslint-config-next ein eslint-plugin-react mit
      # peer `^10` zieht (7.38 stable oder spaeter).
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      # @vitejs/plugin-react 6 verlangt vite ^8, vitest 5 bringt vite 7 mit.
      # 5.2.0 deckt ^4 bis ^8 ab und passt damit auch nachher noch. Weg, sobald
      # vitest auf vite 8 steht.
      - dependency-name: '@vitejs/plugin-react'
        update-types: [version-update:semver-major]

  # The help site (help/) has a lockfile of its own; nothing in it ships in
  # the app image.
  - package-ecosystem: npm
    directory: /help
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      help:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  # The help site's base images (node for the build, caddy to serve it).
  - package-ecosystem: docker
    directory: /help
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
