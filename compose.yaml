# ══════════════════════════════════════════════════════════════════════════════
# GoodWorkshop — On-Premise
#
#   docker compose --profile tls up -d
#
# ZWEI DINGE, DIE HIER ZUERST SCHIEFGEHEN:
#
# 1. Passkeys brauchen HTTPS. Außer auf localhost verweigern Browser WebAuthn
#    über http:// -- eine Installation auf http://192.168.1.50:3000 hat gar
#    keine Passkeys. Deshalb ist das `tls`-Profil der empfohlene Weg und der
#    E-Mail-Token ein vollwertiger zweiter Weg, keine Notlösung.
#
# 2. GW_RP_ID hängt am Hostnamen. Wird er nach der Passkey-Registrierung
#    geändert, sind ALLE registrierten Passkeys ungültig. Vorher festlegen.
#
# Ohne HTTPS und ohne SMTP kommt man trotzdem hinein:
#    docker compose exec app node scripts/cli.mjs login-link --email du@example.com
# ══════════════════════════════════════════════════════════════════════════════

# Kein Datenbank-Passwort, nirgends. Die Rollen authentifizieren sich über einen
# geteilten Unix-Socket per Peer-Authentifizierung (siehe POSTGRES_INITDB_ARGS
# unten): es gibt kein Geheimnis, das in eine .env, ein Log oder ein Backup
# geraten könnte.
#
# Zwei Anker statt einem. Der Web-Container bekommt ausschließlich gw_app --
# die unprivilegierte Rolle, für die RLS, NOINHERIT und das revoke auf die
# Identitätstabellen gebaut sind. Gäbe man ihm den Anker mit, stünde die
# Superuser-Verbindung fertig in process.env des einen Containers, den ein
# Angreifer zuerst erreicht, und der ganze Wall wäre eine Zeile wert.
x-app-db: &app-db
  DATABASE_URL: postgres://gw_app@/goodworkshop?host=/var/run/postgresql

x-migrate-db: &migrate-db
  DATABASE_URL: postgres://gw_app@/goodworkshop?host=/var/run/postgresql
  MIGRATION_DATABASE_URL: postgres://gw_owner@/goodworkshop?host=/var/run/postgresql
  ADMIN_DATABASE_URL: postgres://postgres@/goodworkshop?host=/var/run/postgresql

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: goodworkshop
      POSTGRES_USER: postgres
      # Peer über den Socket, nichts über TCP. Der Kommentar hier behauptete
      # früher Peer-Authentifizierung, während initdb ohne --auth-local auf
      # `trust` steht: jeder Prozess im App-Container und jeder Nachbarcontainer
      # konnte sich als postgres verbinden. POSTGRES_HOST_AUTH_METHOD betrifft
      # ausschließlich TCP und hat den Socket nie berührt.
      POSTGRES_INITDB_ARGS: '--auth-local=peer --auth-host=reject'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pgsocket:/var/run/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d goodworkshop']
      interval: 5s
      timeout: 5s
      retries: 20

  # Läuft einmal und beendet sich. `app` startet erst, wenn das hier
  # erfolgreich durch ist -- ein Rolling Deploy mit ausstehender Migration
  # liefert damit gar nichts erst aus.
  migrate:
    image: ghcr.io/rolealpha/good-workshop:${GW_VERSION:?GW_VERSION muss gesetzt sein -- ein beweglicher Tag ist kein Deployment}
    restart: 'no'
    command: >-
      sh -c "node scripts/db-bootstrap.mjs &&
             node scripts/migrate.mjs &&
             node scripts/provision.mjs"
    environment:
      <<: *migrate-db
      GW_APP_URL: ${GW_APP_URL:?GW_APP_URL muss gesetzt sein}
      GW_EDITION: ${GW_EDITION:-community}
      # Legt beim allerersten Lauf einen Admin an und druckt einen einmaligen
      # Anmeldelink auf stdout -- unabhängig von der Mail-Konfiguration.
      GW_BOOTSTRAP_ADMIN_EMAIL: ${GW_BOOTSTRAP_ADMIN_EMAIL:-}
    volumes:
      - pgsocket:/var/run/postgresql
    depends_on:
      db:
        condition: service_healthy

  app:
    image: ghcr.io/rolealpha/good-workshop:${GW_VERSION:?GW_VERSION muss gesetzt sein -- ein beweglicher Tag ist kein Deployment}
    restart: unless-stopped
    environment:
      <<: *app-db
      GW_APP_URL: ${GW_APP_URL:?GW_APP_URL muss gesetzt sein}
      GW_RP_ID: ${GW_RP_ID:-}
      # Ohne Default. `console` druckt vollständige, gültige Anmeldelinks nach
      # stdout -- eine richtige Entscheidung für eine Installation ohne Relay,
      # und eine, die man trifft, statt sie zu bekommen, weil man nichts gesagt
      # hat. Wer `docker logs` lesen kann, konnte sich sonst für jede beliebige
      # Adresse einen Link ausstellen lassen und abholen.
      GW_MAIL_TRANSPORT: ${GW_MAIL_TRANSPORT:?GW_MAIL_TRANSPORT muss gesetzt sein -- smtp, console oder none}
      # Entweder die URL direkt -- oder, besser, SMTP_URL_FILE auf ein Docker
      # Secret. Eine Environment-Variable mit Passwort steht in `docker
      # inspect`, in /proc/<pid>/environ und in jedem Core-Dump; ein Secret
      # liegt auf einem tmpfs und nur im Dateisystem des Containers.
      SMTP_URL: ${SMTP_URL:-}
      SMTP_URL_FILE: ${SMTP_URL_FILE:-}
      SMTP_FROM: ${SMTP_FROM:-}
      GW_EDITION: ${GW_EDITION:-community}
      GW_COLLAB_PORT: '3001'
    volumes:
      - pgsocket:/var/run/postgresql
    # Nur an 127.0.0.1, nie an 0.0.0.0: ohne den Proxy davor ist nichts
    # erreichbar, auch bei falsch stehender Firewall nicht.
    #
    # Zwei Ports: die Anwendung, und der Kollaborations-Dienst. Der zweite
    # existiert, weil Next aus einem Route-Handler kein WebSocket-Upgrade
    # bedienen kann -- er läuft aber im selben Container, aus demselben Image.
    ports:
      - '127.0.0.1:${GW_PORT:-3000}:3000'
      - '127.0.0.1:${GW_COLLAB_PORT:-3001}:3001'
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Automatisches HTTPS. Ohne das keine Passkeys -- siehe oben.
  caddy:
    profiles: [tls]
    image: caddy:2-alpine
    restart: unless-stopped
    # `{$GW_HOSTNAME}` im Caddyfile ist Caddys eigene Substitution INNERHALB des
    # gemounteten Files, keine Compose-Interpolation -- und Compose reicht .env
    # nicht von sich aus in Container. Ohne diese Zeile hat der Site-Block keine
    # Adresse, der Proxy kommt nicht hoch, und weil `app` nur an 127.0.0.1
    # hängt, ist die Installation von außen unerreichbar. Der nächste Griff des
    # Betreibers ist dann HTTP ohne TLS.
    environment:
      GW_HOSTNAME: ${GW_HOSTNAME:?GW_HOSTNAME muss gesetzt sein}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]

volumes:
  pgdata:
  pgsocket:
  caddy_data:
  caddy_config:
