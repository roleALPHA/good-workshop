name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      # Die README ist Teil des Produkts: sie ist der einzige Weg, auf dem eine
      # Betreiberin erfährt, was zu setzen ist. Dieser Schritt prüft nicht, ob
      # ihre Sätze stimmen, sondern die Kopplungen, an denen sie bisher still
      # falsch wurde -- eine dokumentierte Variable, die keinen Container
      # erreicht, ein Befehl, den es nicht mehr gibt.
      - name: Doku und Code stimmen überein
        run: pnpm check:docs

  unit:
    name: Unit & Component Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  db:
    name: Schema & Tenant Isolation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: goodworkshop
          POSTGRES_USER: postgres
          # No password anywhere, on purpose: the port is only reachable from
          # this job's network namespace, and a secret that does not exist
          # cannot leak into a log or an artifact.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d goodworkshop"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      ADMIN_DATABASE_URL: postgres://postgres@127.0.0.1:5433/goodworkshop
      MIGRATION_DATABASE_URL: postgres://gw_owner@127.0.0.1:5433/goodworkshop
      DATABASE_URL: postgres://gw_app@127.0.0.1:5433/goodworkshop
      OPS_DATABASE_URL: postgres://gw_ops@127.0.0.1:5433/goodworkshop
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Bootstrap roles
        run: pnpm db:bootstrap
      # Dieselbe Reihenfolge wie in compose.yaml: erst lesen und abbrechen, dann
      # schreiben. Steht der Schritt hier, bleibt er auch dann geprüft, wenn
      # niemand das Image baut.
      - name: Preflight
        run: pnpm db:preflight
      - name: Apply migrations
        run: pnpm db:migrate
      - name: Provision built-in module types
        run: pnpm db:provision
      # Provisioning runs on every boot in production, so "runs twice without
      # changing anything" is a property worth checking, not assuming.
      - name: Provisioning is idempotent
        run: pnpm db:provision

      # The most important job in this workflow. A table shipped without RLS is
      # a silent, total data leak with no symptom -- no feature breaks, and
      # every tenant can read every other tenant's rows.
      - name: Tenant isolation and auth
        run: pnpm test:db
        env:
          GW_APP_URL: http://localhost:3000

  build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      # Deliberately --load without a push: a broken Dockerfile has to surface
      # in the PR that broke it, not weeks later when someone cuts a tag.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          push: false
          tags: goodworkshop:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Deliberately WITHOUT a database. This step is about the image -- does
      # the standalone bundle boot with every file it needs -- and the schema
      # is proven against a real Postgres by the `db` job. Two things are
      # asserted, and the second is the interesting one: the health endpoint
      # must fail CLOSED rather than crash or, worse, cheerfully answer 200
      # while it cannot reach anything.
      - name: Smoke test the image
        run: |
          docker run -d --name gw-ci -p 3000:3000 \
            -e GW_APP_URL=http://localhost:3000 goodworkshop:ci

          # Gewartet wird auf /api/health, und zwar auf IRGENDEINE Antwort.
          # Ohne Datenbank rendert keine Seite dieser Anwendung mehr -- die
          # Startseite leitet auf die Bibliothek, und die braucht eine. Der
          # Endpunkt antwortet trotzdem, und genau das ist die Frage dieses
          # Jobs: bootet das Standalone-Bundle mit allen Dateien, die es
          # braucht, und liefert es aus.
          ready=
          for i in $(seq 1 40); do
            if curl -s -o /dev/null http://localhost:3000/api/health; then
              echo "serving after ${i}s"
              ready=1
              break
            fi
            sleep 1
          done

          if [ -z "$ready" ]; then
            echo "::error::Der Container antwortet nicht auf /api/health"
            docker logs gw-ci
            docker rm -f gw-ci
            exit 1
          fi

          status=$(curl -s -o /tmp/health.json -w '%{http_code}' http://localhost:3000/api/health)
          cat /tmp/health.json
          docker rm -f gw-ci

          if [ "$status" != "503" ]; then
            echo "::error::Ohne Datenbank muss der Healthcheck 503 melden, war: $status"
            exit 1
          fi
          grep -q '"name":"database","ok":false' /tmp/health.json || {
            echo "::error::Der Healthcheck nennt die Datenbank nicht als Ursache"
            exit 1
          }

  # DER WEG, DEN EINE BETREIBERIN WIRKLICH GEHT.
  #
  # Alle anderen Jobs sprechen eine Datenbank an, die der Runner gestartet hat,
  # mit `trust` und über TCP. Damit war compose.yaml ungetestet -- und genau
  # dort lagen zwei Fehler, die jede frische Installation unbrauchbar machten:
  # der Postgres-Entrypoint initialisiert ohne Passwort oder `trust` gar nicht,
  # und Peer-Authentifizierung über die Containergrenze kann nie treffen, weil
  # die uid des App-Containers im Datenbank-Container niemandem gehört.
  #
  # Beides hätte dieser Job am Tag seiner Entstehung gemeldet.
  compose:
    name: On-Prem-Stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          push: false
          tags: ghcr.io/rolealpha/good-workshop:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: .env wie in der Anleitung
        run: |
          cat > .env <<'ENV'
          GW_VERSION=ci
          GW_APP_URL=http://127.0.0.1:3000
          GW_MAIL_TRANSPORT=console
          GW_OPS_TOKEN=ci-token
          GW_BOOTSTRAP_ADMIN_EMAIL=ci@example.test
          ENV

      # Ohne --profile tls, und das ist Absicht: der Proxy braucht einen
      # öffentlich auflösenden Hostnamen, den ein Runner nicht hat. Geprüft wird
      # damit zugleich, dass ein `up` ohne das Profil nicht an einem Wert
      # scheitert, den nur der Proxy braucht -- das tat es schon einmal.
      - name: Stack hochfahren
        run: docker compose up -d --wait --wait-timeout 180

      - name: Die Startkette hat getan, was sie verspricht
        run: |
          docker compose logs migrate
          for expected in "Bootstrap complete" "Vorprüfung" "Migrations applied" "Provisioned"; do
            docker compose logs migrate | grep -q "$expected" || {
              echo "::error::In der Startkette fehlt: $expected"
              exit 1
            }
          done

      - name: Healthcheck
        run: |
          curl -fsS --retry 10 --retry-delay 2 --retry-all-errors             http://127.0.0.1:3000/api/health > /tmp/health.json
          cat /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json || {
            echo "::error::Der Stack meldet sich nicht gesund"
            exit 1
          }
          # GW_OPS_TOKEN und GW_VERSION müssen den Container erreichen. Beide
          # standen schon einmal in der Anleitung, ohne durchgereicht zu werden.
          curl -fsS -H 'x-ops-token: ci-token' http://127.0.0.1:3000/api/health > /tmp/ops.json
          grep -q '"version":"ci"' /tmp/ops.json || {
            echo "::error::Der ausführliche Healthcheck meldet nicht die Version aus der .env"
            cat /tmp/ops.json
            exit 1
          }

      # Der Web-Container darf von den DATENBANKROLLEN ausschließlich gw_app
      # kennen. Läge das Superuser-Passwort mit darin, wäre die Rollentrennung,
      # auf der RLS und NOINHERIT aufbauen, eine Zeile wert.
      #
      # `app` gehört dazu und ist keine Rolle: das ist der Schlüssel, mit dem
      # die Anwendung die in der Oberfläche hinterlegten Zugangsdaten
      # entschlüsselt. Deshalb wird hier auf die genaue Liste geprüft und nicht
      # auf "nur eines" -- ein weiterer Eintrag soll auffallen.
      - name: Der App-Container kennt nur seine eigene Rolle
        run: |
          # `xargs` ohne Argumente: trimmt und fügt mit einfachen Leerzeichen
          # zusammen, damit der Vergleich nicht an einem \r oder einem
          # nachgestellten Leerzeichen scheitert.
          secrets=$(docker compose exec -T app ls /run/db-secrets | tr -d '\r' | sort | xargs)
          echo "app sieht: $secrets"
          [ "$secrets" = "app gw_app" ] || {
            echo "::error::Der App-Container sieht etwas anderes als 'app gw_app': $secrets"
            exit 1
          }
          if docker compose exec -T app node -e "
            const pg = require('pg')
            new pg.Client({ connectionString: 'postgres://postgres@db:5432/goodworkshop' })
              .connect().then(() => process.exit(0)).catch(() => process.exit(1))"; then
            echo "::error::Der App-Container konnte sich als postgres verbinden"
            exit 1
          fi

      # Die Regression, die eine Installation beim ZWEITEN Start verlor: der
      # erste `up` gelang, der zweite nicht.
      - name: Ein zweiter up ändert nichts
        run: |
          docker compose up -d --wait --wait-timeout 180
          docker compose logs migrate | grep -q "Migrations applied" || {
            echo "::error::Der zweite Start ist nicht sauber durchgelaufen"
            docker compose logs migrate
            exit 1
          }
          curl -fsS http://127.0.0.1:3000/api/health | grep -q '"status":"ok"'

      - name: Die dokumentierte Sicherung funktioniert
        run: |
          docker compose exec -T -u postgres db pg_dump goodworkshop > /tmp/dump.sql
          grep -q 'CREATE TABLE' /tmp/dump.sql || {
            echo "::error::Der Dump enthält kein Schema"
            exit 1
          }

      - if: ${{ failure() }}
        run: docker compose logs
      - if: ${{ always() }}
        run: docker compose down -v

  e2e:
    name: E2E (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    # The authenticated half of the suite is the only thing that can prove the
    # editor persists anything -- everything else happens in memory. Without a
    # database those tests skip themselves, which would be a quiet way to stop
    # testing the feature the product exists for.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: goodworkshop
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d goodworkshop"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      ADMIN_DATABASE_URL: postgres://postgres@127.0.0.1:5433/goodworkshop
      MIGRATION_DATABASE_URL: postgres://gw_owner@127.0.0.1:5433/goodworkshop
      DATABASE_URL: postgres://gw_app@127.0.0.1:5433/goodworkshop
      GW_APP_URL: http://127.0.0.1:3210
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Prepare the database
        run: pnpm db:bootstrap && pnpm db:preflight && pnpm db:migrate && pnpm db:provision

      # Built as its own step so a compile error is reported as one, and so the
      # suite runs against the standalone output the Docker image ships.
      - run: pnpm build

      - run: pnpm exec playwright test --shard=${{ matrix.shard }}/2
        env:
          E2E_SKIP_BUILD: '1'
          # The collaboration server runs alongside the app; without it a
          # signed-in editor has nowhere to write.
          GW_COLLAB_PORT: '3211'
          # Each shard signs in as its own account, so two runners cannot fight
          # over one session.
          E2E_EMAIL: e2e-shard-${{ matrix.shard }}@example.test

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7
