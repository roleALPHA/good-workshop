# Serves the built help site inside its container. TLS, the host name and the
# language redirect on / are the outer proxy's business; this only answers on
# :8080 for whoever forwards to it.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    # Behind the proxy this server's own scheme and port are wrong for the
    # browser; a relative Location keeps whatever the visitor used.
    absolute_redirect off;
    # No access log. The proxy in front forwards the visitor's address, and a
    # container log keeps it as long as the container lives -- longer than the
    # privacy policy's fourteen days. The pages are public; nobody needs it.
    access_log off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Starlight writes every page as <path>/index.html.
    location / {
        try_files $uri $uri/ =404;
    }

    # Hashed file names: a new build has new names, so these never go stale.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    error_page 404 /404.html;
}
