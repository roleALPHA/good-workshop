name: Publish image

# Two occasions, one pipeline -- deliberately. The preview deployment pulls the
# same artifact a release produces, so "works on the preview" means something.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # Normalised to lowercase per job below. `github.repository` keeps the
  # organisation's casing ("roleALPHA/..."), and a registry reference with an
  # uppercase letter is rejected outright: "repository name must be lowercase".
  # metadata-action lowercases its own outputs, so this only bites where the
  # name is used directly -- push-by-digest and imagetools.
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Each architecture is built on a runner of that architecture and pushed by
  # digest only; the manifest list is assembled afterwards. The alternative --
  # one job with QEMU emulation -- turns a 2-minute Next.js build into a
  # 20-minute one, and both runner labels are free for public repositories.
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      # id-token: write and attestations: write used to be here without any step
      # using them -- the provenance comes from BuildKit (provenance: mode=max)
      # and needs neither. id-token: write is the right to mint an OIDC token for
      # arbitrary cloud trust policies: the furthest-reaching of the four, and
      # pure decoration.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Normalise names
        run: |
          {
            echo "PLATFORM_PAIR=${platform//\//-}"
            echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}"
            # Reported by /api/health. On a preview that pulls itself, "which
            # commit am I actually looking at" is the question you have every
            # single time -- a bare branch name cannot answer it.
            echo "GW_VERSION=${GITHUB_REF_NAME}-${GITHUB_SHA::7}"
          } >> "$GITHUB_ENV"
        env:
          platform: ${{ matrix.platform }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            GW_VERSION=${{ env.GW_VERSION }}
          labels: ${{ steps.meta.outputs.labels }}
          # SBOM and provenance cost nothing here and are what lets an on-prem
          # admin run the image through a scanner and see where it came from.
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish manifest
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - name: Normalise image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=ref,event=branch
            type=sha,prefix=sha-,format=short

      - name: Create manifest list
        working-directory: /tmp/digests
        run: |
          # shellcheck disable=SC2046  # word splitting is the point: both
          # substitutions expand into multiple separate CLI arguments.
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${REGISTRY}/${IMAGE_NAME}@sha256:%s " *)

      - name: Inspect published image
        # Through env rather than as ${{ }} directly in the script -- the pattern
        # this workflow keeps to everywhere else. The value here comes from
        # github.ref_name and cannot be influenced from a fork, but an exception
        # to the pattern is exactly what gets overlooked next time.
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker buildx imagetools inspect \
            "${REGISTRY}/${IMAGE_NAME}:${VERSION}"
