# ══════════════════════════════════════════════════════════════════════════════
# GoodWorkshop — On-Premise
#
#   docker compose --profile tls up -d
#
# ZWEI DINGE, DIE HIER ZUERST SCHIEFGEHEN:
#
# 1. Passkeys brauchen HTTPS. Außer auf localhost verweigern Browser WebAuthn
#    über http:// -- eine Installation auf http://192.168.1.50:3000 hat gar
#    keine Passkeys. Deshalb ist das `tls`-Profil der empfohlene Weg und der
#    E-Mail-Token ein vollwertiger zweiter Weg, keine Notlösung.
#
# 2. GW_RP_ID hängt am Hostnamen. Wird er nach der Passkey-Registrierung
#    geändert, sind ALLE registrierten Passkeys ungültig. Vorher festlegen.
#
# Ohne HTTPS und ohne SMTP kommt man trotzdem hinein:
#    docker compose exec app node scripts/cli.mjs login-link --email du@example.com
# ══════════════════════════════════════════════════════════════════════════════

# JEDE ROLLE HAT IHR EIGENES PASSWORT, UND KEINES STEHT IN DIESER DATEI.
#
# Der `secrets`-Dienst erzeugt beim ersten Start je ein zufälliges Passwort pro
# Rolle in ein Volume; db, migrate und app lesen sie von dort. Damit steht kein
# Geheimnis in der .env, in `docker inspect`, in einem Dump oder in einem
# Logauszug -- aber die Rollentrennung ist zum ersten Mal tatsächlich
# durchgesetzt.
#
# Vorher stand hier Peer-Authentifizierung über einen geteilten Socket, mit der
# schöneren Zusage "kein Passwort, nirgends". Sie konnte nicht funktionieren:
# Peer vergleicht den OS-Benutzer des verbindenden PROZESSES mit dem
# Rollennamen, und der App-Container läuft als `node` (uid 1000), während der
# Datenbank-Container uid 70 als `postgres` kennt und bei 1000 niemanden. Keine
# Verbindung über die Containergrenze konnte je gelingen -- und weil der
# Entrypoint des Postgres-Images ohne Passwort oder `trust` gar nicht erst
# initialisiert, startete der Stack auf einer frischen Installation nicht.
#
# `trust` wäre der falsche Ausweg gewesen: es lässt jeden Prozess in jedem
# Container des Netzes als jede Rolle herein, Superuser eingeschlossen. RLS,
# NOINHERIT und das revoke auf die Identitätstabellen ruhen alle darauf, dass
# die Anwendung ausschließlich gw_app ist.
#
# Zwei Anker statt einem. Der Web-Container bekommt ausschließlich gw_app --
# die unprivilegierte Rolle, für die RLS, NOINHERIT und das revoke auf die
# Identitätstabellen gebaut sind. Gäbe man ihm den Anker mit, stünde die
# Superuser-Verbindung fertig im einen Container, den ein Angreifer zuerst
# erreicht, und der ganze Wall wäre eine Zeile wert.
#
# `db` veröffentlicht keinen Port. Erreichbar ist die Datenbank nur aus diesem
# Compose-Netz -- und dort nur mit dem Passwort der jeweiligen Rolle.
x-app-db: &app-db
  DATABASE_URL: postgres://gw_app@db:5432/goodworkshop
  DATABASE_PASSWORD_FILE: /run/db-secrets/gw_app/password

x-migrate-db: &migrate-db
  DATABASE_URL: postgres://gw_app@db:5432/goodworkshop
  DATABASE_PASSWORD_FILE: /run/db-secrets/gw_app/password
  MIGRATION_DATABASE_URL: postgres://gw_owner@db:5432/goodworkshop
  MIGRATION_DATABASE_PASSWORD_FILE: /run/db-secrets/gw_owner/password
  ADMIN_DATABASE_URL: postgres://postgres@db:5432/goodworkshop
  ADMIN_DATABASE_PASSWORD_FILE: /run/db-secrets/postgres/password

services:
  # Läuft einmal und beendet sich. Erzeugt fehlende Rollen-Passwörter in das
  # Volume, aus dem db, migrate und app sie lesen -- und rührt vorhandene nicht
  # an, damit ein Neustart keine laufende Installation aussperrt.
  secrets:
    image: ghcr.io/rolealpha/good-workshop:${GW_VERSION:?GW_VERSION muss gesetzt sein -- ein beweglicher Tag ist kein Deployment}
    restart: 'no'
    # Als root, und nur dieser eine Dienst: ein frisches Docker-Volume gehört
    # root, und sonst könnte niemand die erste Datei hineinschreiben. Er tut
    # genau eine Sache und endet; app und migrate laufen unverändert als `node`.
    user: '0:0'
    command: ['node', 'scripts/db-secrets.mjs']
    # Der einzige Ort, an dem alle vier zusammenliegen -- in einem Container,
    # der Sekunden lebt und nichts aus dem Netz annimmt.
    volumes:
      - secret_postgres:/run/db-secrets/postgres
      - secret_gw_owner:/run/db-secrets/gw_owner
      - secret_gw_app:/run/db-secrets/gw_app
      - secret_gw_ops:/run/db-secrets/gw_ops
      - secret_app:/run/db-secrets/app

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: goodworkshop
      POSTGRES_USER: postgres
      # Aus der Datei, nicht aus der Umgebung: POSTGRES_PASSWORD stünde in
      # `docker inspect`. Der Entrypoint verlangt eines von beiden, sonst
      # initialisiert er die Datenbank gar nicht erst.
      POSTGRES_PASSWORD_FILE: /run/db-secrets/postgres/password
      # `peer` für den lokalen Socket IM Container -- das ist der Weg, den
      # `scripts/backup.sh` geht, und der Grund für dessen `-u postgres`: über
      # diesen Socket entscheidet der Benutzername. Über TCP gilt der
      # Standard scram-sha-256, und ohne veröffentlichten Port ist das Netz
      # dieses Stacks die einzige Herkunft, aus der jemand es versuchen kann.
      POSTGRES_INITDB_ARGS: '--auth-local=peer'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - secret_postgres:/run/db-secrets/postgres:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d goodworkshop']
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      secrets:
        condition: service_completed_successfully

  # Läuft einmal und beendet sich. `app` startet erst, wenn das hier
  # erfolgreich durch ist -- ein Rolling Deploy mit ausstehender Migration
  # liefert damit gar nichts erst aus.
  migrate:
    image: ghcr.io/rolealpha/good-workshop:${GW_VERSION:?GW_VERSION muss gesetzt sein -- ein beweglicher Tag ist kein Deployment}
    restart: 'no'
    # Vier Schritte, und die Reihenfolge ist die Aussage: preflight liest nur und
    # bricht ab, BEVOR migrate die erste Zeile anfasst. Eine Migration, die an
    # den vorhandenen Daten scheitert, tut das sonst mittendrin -- mit einem
    # nackten Postgres-Fehler, einem `app`, das wegen
    # service_completed_successfully gar nicht erst startet, und ohne ein Wort
    # dazu, welche Zeilen gemeint sind.
    command: >-
      sh -c "node scripts/db-bootstrap.mjs &&
             node scripts/preflight.mjs &&
             node scripts/migrate.mjs &&
             node scripts/provision.mjs"
    environment:
      <<: *migrate-db
      GW_APP_URL: ${GW_APP_URL:?GW_APP_URL muss gesetzt sein}
      GW_EDITION: ${GW_EDITION:-community}
      # Legt beim allerersten Lauf einen Admin an und druckt einen einmaligen
      # Anmeldelink auf stdout -- unabhängig von der Mail-Konfiguration.
      GW_BOOTSTRAP_ADMIN_EMAIL: ${GW_BOOTSTRAP_ADMIN_EMAIL:-}
    # Drei, weil dieser Dienst drei Rollen braucht: Superuser für die Rollen
    # selbst, gw_owner für das Schema, gw_app für das Provisioning durch
    # dieselbe Tür wie die Anwendung. gw_ops bekommt er nicht.
    volumes:
      - secret_postgres:/run/db-secrets/postgres:ro
      - secret_gw_owner:/run/db-secrets/gw_owner:ro
      - secret_gw_app:/run/db-secrets/gw_app:ro
    depends_on:
      db:
        condition: service_healthy

  app:
    image: ghcr.io/rolealpha/good-workshop:${GW_VERSION:?GW_VERSION muss gesetzt sein -- ein beweglicher Tag ist kein Deployment}
    restart: unless-stopped
    environment:
      <<: *app-db
      GW_APP_URL: ${GW_APP_URL:?GW_APP_URL muss gesetzt sein}
      GW_RP_ID: ${GW_RP_ID:-}
      # Ohne Default. `console` druckt vollständige, gültige Anmeldelinks nach
      # stdout -- eine richtige Entscheidung für eine Installation ohne Relay,
      # und eine, die man trifft, statt sie zu bekommen, weil man nichts gesagt
      # hat. Wer `docker logs` lesen kann, konnte sich sonst für jede beliebige
      # Adresse einen Link ausstellen lassen und abholen.
      GW_MAIL_TRANSPORT: ${GW_MAIL_TRANSPORT:?GW_MAIL_TRANSPORT muss gesetzt sein -- smtp, graph, console oder none}
      # Entweder die URL direkt -- oder, besser, SMTP_URL_FILE auf ein Docker
      # Secret. Eine Environment-Variable mit Passwort steht in `docker
      # inspect`, in /proc/<pid>/environ und in jedem Core-Dump; ein Secret
      # liegt auf einem tmpfs und nur im Dateisystem des Containers.
      SMTP_URL: ${SMTP_URL:-}
      SMTP_URL_FILE: ${SMTP_URL_FILE:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # Microsoft Graph statt SMTP. Viele Microsoft-365-Mandanten haben SMTP
      # AUTH abgeschaltet -- dort ist das nicht die bequemere, sondern die
      # einzige Möglichkeit. Das Geheimnis besser als GW_GRAPH_CLIENT_SECRET_FILE
      # aus einer Datei, aus demselben Grund wie bei SMTP_URL_FILE.
      GW_GRAPH_TENANT_ID: ${GW_GRAPH_TENANT_ID:-}
      GW_GRAPH_CLIENT_ID: ${GW_GRAPH_CLIENT_ID:-}
      GW_GRAPH_CLIENT_SECRET: ${GW_GRAPH_CLIENT_SECRET:-}
      GW_GRAPH_CLIENT_SECRET_FILE: ${GW_GRAPH_CLIENT_SECRET_FILE:-}
      GW_GRAPH_SENDER: ${GW_GRAPH_SENDER:-}
      GW_EDITION: ${GW_EDITION:-community}
      # Der Tag, der laut .env laufen soll -- derselbe Wert, der oben das Image
      # auswählt. Ohne diese Zeile meldet /api/health den ARG-Wert aus dem
      # Dockerfile (`dev` bei einem selbst gebauten Image), und die eine Frage,
      # für die der Endpunkt existiert -- welcher Stand läuft hier -- wird
      # falsch beantwortet.
      GW_VERSION: ${GW_VERSION}
      GW_COLLAB_PORT: '3001'
      # Standen in .env.example und in der README, erreichten den Container aber
      # nicht: eine dokumentierte Variable, die nirgends ankommt, ist eine
      # Anleitung, die ins Leere führt. `check-docs.mjs` prüft das jetzt.
      # Entschlüsselt die in der Oberfläche hinterlegten Zugangsdaten. Ohne
      # Wert wird die Datei aus dem Volume benutzt; wer den Schlüssel lieber
      # selbst verwaltet, setzt GW_SECRET_KEY in der .env.
      GW_SECRET_KEY: ${GW_SECRET_KEY:-}
      GW_SECRET_KEY_FILE: ${GW_SECRET_KEY_FILE:-/run/db-secrets/app/secret-key}
      GW_COLLAB_URL: ${GW_COLLAB_URL:-}
      GW_COLLAB_INTERNAL_URL: ${GW_COLLAB_INTERNAL_URL:-}
      # Ohne diesen Wert antwortet /api/health nur mit "ok" bzw. "unhealthy"
      # und welche Prüfung gescheitert ist -- der Endpunkt steht im Internet.
      # Wer ihn setzt, bekommt mit `x-ops-token` zusätzlich Version,
      # Migrationsstand und den Treiberfehler im Klartext.
      GW_OPS_TOKEN: ${GW_OPS_TOKEN:-}
      # Wie viele Proxys vor der Anwendung stehen. Nur für Drosselung und Logs.
      GW_TRUSTED_PROXIES: ${GW_TRUSTED_PROXIES:-1}
      GW_SESSION_IDLE_DAYS: ${GW_SESSION_IDLE_DAYS:-14}
    # EINS. Der Web-Container kennt das Passwort von gw_app und von keiner
    # anderen Rolle -- das ist der "zwei Anker"-Punkt von oben, in Dateiform.
    # Läge hier das Superuser-Geheimnis mit, wäre der ganze Wall eine Zeile wert.
    #
    # Dazu der Anwendungsschlüssel: er entschlüsselt die Zugangsdaten, die eine
    # Administratorin in der Oberfläche einträgt. Er gehört ins Backup -- anders
    # als die Rollen-Passwörter, die jede Installation neu erzeugen kann.
    volumes:
      - secret_gw_app:/run/db-secrets/gw_app:ro
      - secret_app:/run/db-secrets/app:ro
    # Nur an 127.0.0.1, nie an 0.0.0.0: ohne den Proxy davor ist nichts
    # erreichbar, auch bei falsch stehender Firewall nicht.
    #
    # Zwei Ports: die Anwendung, und der Kollaborations-Dienst. Der zweite
    # existiert, weil Next aus einem Route-Handler kein WebSocket-Upgrade
    # bedienen kann -- er läuft aber im selben Container, aus demselben Image.
    ports:
      - '127.0.0.1:${GW_PORT:-3000}:3000'
      - '127.0.0.1:${GW_COLLAB_PORT:-3001}:3001'
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Automatisches HTTPS. Ohne das keine Passkeys -- siehe oben.
  caddy:
    profiles: [tls]
    image: caddy:2-alpine
    restart: unless-stopped
    # `{$GW_HOSTNAME}` im Caddyfile ist Caddys eigene Substitution INNERHALB des
    # gemounteten Files, keine Compose-Interpolation -- und Compose reicht .env
    # nicht von sich aus in Container. Ohne diese Zeile hat der Site-Block keine
    # Adresse, der Proxy kommt nicht hoch, und weil `app` nur an 127.0.0.1
    # hängt, ist die Installation von außen unerreichbar. Der nächste Griff des
    # Betreibers ist dann HTTP ohne TLS.
    environment:
      GW_HOSTNAME: ${GW_HOSTNAME:-}
    # Geprüft hier statt per `${GW_HOSTNAME:?}` oben: Compose interpoliert die
    # GANZE Datei beim Laden, auch Dienste, deren Profil gar nicht aktiv ist.
    # Ein Pflichtfeld an dieser Stelle hätte also jedes `docker compose up`
    # ohne tls-Profil abgebrochen -- und ohne HTTPS starten zu können, ist ein
    # ausdrücklich unterstützter Weg. So scheitert es laut, aber nur für die,
    # die den Proxy wirklich benutzen.
    command: >-
      sh -c 'test -n "$$GW_HOSTNAME" || {
               echo "GW_HOSTNAME muss gesetzt sein: der Hostname, auf den das TLS-Zertifikat lautet." >&2
               echo "Er muss oeffentlich auf diesen Server aufloesen, sonst schlaegt die Ausstellung fehl." >&2
               exit 1
             }
             exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile'
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]

volumes:
  pgdata:
  # Ein Volume je Rolle, damit ein Dienst nur das bekommt, was er braucht.
  secret_postgres:
  secret_gw_owner:
  secret_gw_app:
  secret_gw_ops:
  secret_app:
  caddy_data:
  caddy_config:
