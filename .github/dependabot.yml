version: 2
# A week of cooldown on every ecosystem. The supply-chain attacks of the last
# years published a malicious version and were caught within days; a
# dependency that has been out for a week has had those days. Security updates
# are not delayed by this -- Dependabot applies cooldown to version updates only.
updates:
  # Actions are pinned to full-length commit SHAs, which means they can only be
  # updated by a bot that understands the pin. Without this file the pinning
  # convention silently turns into "we run 2026's actions forever".
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
      production-minor-patch:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
