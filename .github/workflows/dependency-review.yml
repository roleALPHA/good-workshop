name: Dependency Review

# Free for public repositories. It answers one question the other jobs cannot:
# does THIS pull request add a dependency with a known vulnerability, or one
# whose licence this project cannot accept -- before it is merged, rather than
# after Dependabot notices it on main.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  review:
    name: Review dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Moderate rather than high: this is a small dependency tree and a
          # moderate finding here is a decision somebody should make, not a
          # line in a report nobody opens.
          fail-on-severity: moderate
          # This project is Apache-2.0 with the Commons Clause. Two families
          # cannot ship inside it: strong copyleft (GPL, AGPL), which forbids
          # adding a restriction and the Commons Clause is one; and licences
          # with service restrictions of their own (SSPL, BUSL, Elastic), which
          # would bind our users beyond our own terms. scripts/licenses.mjs has
          # the same policy with a reason per licence.
          deny-licenses: >-
            SSPL-1.0, BUSL-1.1, Elastic-2.0,
            GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later,
            AGPL-3.0-only, AGPL-3.0-or-later
